<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>退院時サマリー（画面の例）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --line:#E3E8EF; --line2:#CBD5E1;
  --ink:#0F172A; --ink2:#1F2937; --muted:#4B5563;
  --navy:#0F2A44; --navy2:#163A5C; --navy-ink:#DCE6F2;
  --blue:#1B6EC2; --blue-dark:#155BA3; --blue-soft:#E8F1FB; --blue-line:#B6D1F2;
  --green:#15803D; --green-soft:#E8F5EC; --green-line:#B7E1C4;
  --amber:#B45309; --amber-soft:#FFF4E5; --amber-line:#F4C98A;
  --red:#B91C1C; --red-soft:#FDECEC;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.05);
  --r:14px;
}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased;font-feature-settings:"palt"}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #93C5FD;outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- レイアウト ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--navy);color:var(--navy-ink);padding:20px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:12px;color:#fff;padding:6px 10px 18px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:var(--blue);display:grid;place-items:center;color:#fff}
.brand b{font-size:1.05rem;display:block;line-height:1.3}
.brand small{display:block;font-size:.78rem;color:var(--navy-ink);font-weight:400}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--navy-ink);padding:12px 12px;border-radius:10px;font-size:1rem;text-align:left;min-height:48px}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button[aria-current=page]{background:rgba(255,255,255,.14);color:#fff;font-weight:700}
.nav .cnt{margin-left:auto;background:var(--blue);color:#fff;border-radius:999px;font-size:.8rem;padding:1px 9px;font-weight:700}
.side .sec{font-size:.74rem;letter-spacing:.08em;color:#7E93AB;padding:16px 12px 6px;text-transform:uppercase}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid rgba(255,255,255,.1);color:#fff}
.side .me .av{background:#fff;color:var(--navy)}
.side .me small{display:block;color:var(--navy-ink);font-weight:400;font-size:.8rem}
.main{min-width:0}
.topbar{height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 28px;position:sticky;top:0;z-index:5}
.topbar h1{font-size:1.2rem;margin:0;font-weight:700}
.topbar .date{color:var(--muted);font-size:.95rem}
.guide{margin-bottom:20px;border-color:var(--blue-line);background:linear-gradient(180deg,#F7FAFE,#FFFFFF)}
.ghd{display:flex;align-items:flex-start;gap:12px;padding:18px 24px 6px;flex-wrap:wrap}
.ghd h2{margin:0;font-size:1.15rem}
.ghd .sub{color:var(--ink2);font-size:.95rem;flex-basis:100%}
.ghd .link{margin-left:auto;align-self:flex-start}
.gsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;padding:10px 24px 4px}
.gs{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:.98rem;line-height:1.55}
.gs small{display:block;color:var(--ink2);font-size:.95rem;margin-top:4px;line-height:1.5}
.gn{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.gtry{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding:12px 24px 18px;font-size:.95rem;color:var(--ink2)}
.gtry>b{flex-basis:100%}
.gtry ol{margin:0;padding-left:1.3em;display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:4px 28px;flex-basis:100%}
.gtry li{white-space:normal}
.gnote{color:var(--ink2);font-size:.95rem;flex-basis:100%}
.topbar .sample{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-line);border-radius:999px;padding:4px 12px;font-size:.82rem;font-weight:700;white-space:nowrap}
.content{padding:26px 28px 120px;max-width:1240px}

/* ---------- 共通部品 ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card.pad{padding:22px 24px}
.hd{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line)}
.hd h2{margin:0;font-size:1.1rem}
.hd .sub{color:var(--ink2);font-size:1rem}
.av{width:40px;height:40px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:700;flex:none}
.pill{display:inline-flex;align-items:center;gap:8px;padding:0;border:0;background:transparent;font-weight:700;font-size:1rem;white-space:nowrap;line-height:1.4}
.pill .dot{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.pill .pk{width:22px;height:22px;border-radius:50%;background:#15803D;color:#fff;display:grid;place-items:center;flex:none}
.pill .pk svg.i{width:14px;height:14px;stroke-width:3}
.pill.review{color:#154C90}
.pill.done{color:#0F6B32}
.pill.none{color:#6B7280}
.pill.none .dot{background:transparent;border:2px solid #9CA3AF}
.pill.warn{color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);padding:3px 11px;border-radius:999px;font-size:.92rem}
.pill.making{color:#6B7280}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:0 18px;height:44px;font-weight:700;font-size:.98rem;border:1px solid transparent;white-space:nowrap;transition:background .15s,box-shadow .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-dark)}
.btn.ok{background:var(--green);color:#fff}
.btn.ok:hover{background:#136B33}
.btn.secondary{background:#fff;color:var(--blue);border-color:var(--blue-line)}
.btn.secondary:hover{background:var(--blue-soft)}
.btn.ghost{background:#fff;color:#1F2937;border-color:#94A3B8}
.btn.ghost:hover{background:#F8FAFC}
.btn.lg{height:52px;padding:0 24px;font-size:1.05rem}
.btn.sm{height:38px;padding:0 14px;font-size:.9rem}
.link{background:none;border:0;color:var(--blue);padding:4px 2px;font-size:.92rem;text-decoration:underline;text-underline-offset:3px}
.link.quiet{color:var(--muted);font-size:.85rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:20px}
.kpi{padding:18px 20px}
.kpi .l{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:1rem;font-weight:700}
.kpi .n{font-size:2.1rem;font-weight:700;line-height:1.15;margin-top:6px;letter-spacing:-.01em}
.kpi .n small{font-size:.95rem;color:var(--ink2);margin-left:3px;font-weight:700}
.kpi .m{color:var(--ink2);font-size:.95rem;margin-top:4px}
.bar{height:8px;background:#EDF2F7;border-radius:4px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.bar.g i{background:var(--green)}

/* ---------- 表 ---------- */
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{text-align:left;font-size:.92rem;color:var(--ink2);font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line);background:#FAFBFC;white-space:nowrap}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#F8FAFC}
.tbl .who{display:flex;align-items:center;gap:12px}
.tbl .who b{font-size:1.05rem;display:block;line-height:1.3}
.tbl .who span{color:var(--ink2);font-size:.95rem}
.tbl .meta{color:var(--ink2);font-size:.95rem}
.tbl .meta small{display:block;color:var(--muted);font-size:.92rem}
.tbl td.act{text-align:right;white-space:nowrap}
.tbl .warnmini{display:inline-flex;align-items:center;gap:4px;color:var(--amber);font-size:.84rem;font-weight:700;margin-left:8px}

/* ---------- 確認画面 ---------- */
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.92rem;margin-bottom:14px}
.crumb button{display:inline-flex;align-items:center;gap:6px}
.phead{display:flex;align-items:center;gap:18px;padding:20px 24px;margin-bottom:18px}
.phead .av{width:52px;height:52px;font-size:1.2rem}
.phead h2{margin:0;font-size:1.3rem;line-height:1.3}
.phead h2 span{font-size:.95rem;color:var(--muted);font-weight:400;margin-left:10px}
.phead .meta{color:var(--ink2);font-size:.95rem;margin-top:2px}
.phead .right{margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.phead .right small{color:var(--muted);font-size:.84rem}
.two{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.doc{overflow:hidden}
.doc .sec{padding:18px 24px;border-bottom:1px solid var(--line);scroll-margin-top:90px;transition:background .15s}
.doc .sec:last-child{border-bottom:0}
.doc .sec:hover{background:#FBFCFE}
.doc .sec.warn{background:#FFFBF3;border-left:4px solid var(--amber)}
.doc .sec.flash{box-shadow:inset 0 0 0 3px #FCD34D}
.doc .sec .lab{display:flex;align-items:center;gap:10px;font-size:1rem;font-weight:700;color:var(--ink2);letter-spacing:.02em;margin-bottom:6px}
.doc .sec .val{font-size:1.08rem;line-height:1.8;white-space:pre-wrap}
.doc .sec .val.empty{color:var(--amber);font-weight:700}
.doc .sec .foot{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;margin-top:8px;font-size:.95rem;color:var(--ink2)}
.doc .sec .foot .srcbtn{display:inline-flex;align-items:center;gap:4px;color:var(--blue);background:none;border:0;padding:4px 2px;font-size:.88rem}
.doc .sec .foot .srcbtn svg.i{width:16px;height:16px}
.editbar{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
textarea{width:100%;font:inherit;font-size:1.05rem;line-height:1.8;padding:12px 14px;border:2px solid var(--blue);border-radius:10px;min-height:130px;resize:vertical;color:var(--ink);background:#fff}
textarea.rec{border:1px solid var(--line2);min-height:230px;font-size:.98rem}
.alert{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--amber-line);background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-weight:700}
.srcpane{position:sticky;top:84px}
.srcpane .hd{padding:14px 18px}
.srcpane .hd h2{font-size:1rem}
.tl{list-style:none;margin:0;padding:10px 10px 10px}
.tl li{display:grid;grid-template-columns:66px 1fr;gap:10px;padding:10px 10px;border-radius:10px;font-size:1rem;transition:background .15s}
.tl li .d{font-weight:700;color:var(--ink2);font-size:.88rem}
.tl li .k{color:var(--ink2);font-size:.9rem;display:block}
.tl li.on{background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue-line)}
.srchint{padding:0 18px 14px;color:var(--ink2);font-size:.95rem}
.actions{position:fixed;left:248px;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:saturate(1.2) blur(6px);border-top:1px solid var(--line);z-index:4}
.actions-in{max-width:1240px;padding:12px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.timer{color:var(--ink2);font-size:1rem;display:inline-flex;align-items:center;gap:8px}
.timer .live{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}

/* ---------- 完了 ---------- */
.donecard{max-width:640px;margin:40px auto;text-align:center;padding:44px 32px 36px}
.donecard .ck{width:76px;height:76px;border-radius:50%;background:var(--green-soft);color:var(--green);display:inline-grid;place-items:center;margin-bottom:14px}
.donecard .ck svg.i{width:38px;height:38px;stroke-width:2.5}
.donecard h2{margin:0 0 6px;font-size:1.4rem}
.donecard .t{color:var(--ink2);font-size:1rem;margin:0 0 22px}
.donecard .t b{font-size:1.25rem;color:var(--ink)}
.donecard .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.donecard .minor{margin-top:20px;display:flex;gap:6px 22px;justify-content:center;flex-wrap:wrap}

/* ---------- 事務 ---------- */
.steps{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px;padding:0;list-style:none}
.steps li{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;font-size:1rem;color:var(--ink2)}
.steps li b{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:.85rem}
.makebox{padding:18px 24px 22px;border-top:1px dashed var(--line2);background:#FAFBFD}
.makebox .lab{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink2);font-size:.95rem;margin-bottom:8px;flex-wrap:wrap}
.progress{height:10px;background:#EDF2F7;border-radius:5px;overflow:hidden;margin:12px 0 8px}
.progress i{display:block;height:100%;width:0;background:var(--blue);transition:width 2.2s linear}
.result{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--green-line);background:var(--green-soft);border-radius:12px;padding:14px 16px;margin-top:14px;color:var(--ink)}
.result b{color:var(--green)}
.note{color:var(--ink2);font-size:.95rem;margin:0 0 8px}

/* ---------- 管理 ---------- */
.chart{display:flex;align-items:flex-end;gap:10px;height:120px;padding:6px 4px 0}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.9rem;color:var(--ink2)}
.chart .c i{display:block;width:100%;max-width:38px;background:var(--blue-soft);border:1px solid var(--blue-line);border-radius:6px 6px 2px 2px}
.chart .c.t i{background:var(--blue);border-color:var(--blue)}

.tour{position:fixed;left:248px;right:0;top:64px;z-index:7;background:var(--navy);color:#fff;border-bottom:3px solid var(--blue);box-shadow:0 8px 24px rgba(15,23,42,.25)}
.tour-in{max-width:1240px;padding:14px 28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.tour-n{background:var(--blue);color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.95rem;white-space:nowrap}
.tour-t{flex:1;min-width:260px;line-height:1.6}
.tour-t b{display:block;font-size:1.12rem;font-weight:700}
.tour-t span{display:block;color:#DCE6F2;font-size:.98rem;margin-top:2px}
.tour .link.quiet{color:#DCE6F2}
.tour .btn.primary{min-width:120px}
body.touring .content{padding-top:150px}
@media (max-width:820px){.tour{left:0;top:auto;bottom:0;border-bottom:0;border-top:3px solid var(--blue)}.tour-in{padding:12px 14px}body.touring .content{padding-top:16px;padding-bottom:260px}body.touring .actions{bottom:auto;top:0}}
.lead h2{margin:0 0 8px;font-size:1.3rem;line-height:1.45}
.lead p{margin:0;color:var(--ink2)}
.fl{font-size:1.05rem;font-weight:700;color:var(--ink2);margin-bottom:10px}
.flow{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.fchip{flex:1 1 150px;border-radius:12px;padding:12px 14px;border:1px solid var(--line2);background:#F8FAFC;min-width:150px}
.flow.after .fchip{background:var(--blue-soft);border-color:var(--blue-line)}
.flow .fchip.hi{background:var(--green-soft);border-color:var(--green-line)}
.fchip b{display:block;font-size:1rem;line-height:1.45}
.fchip span{display:block;color:var(--ink2);font-size:.88rem;margin-top:4px;line-height:1.45}
.farrow{display:grid;place-items:center;color:var(--muted)}
.fnote{margin:14px 0 0;font-weight:700;color:var(--ink);font-size:1.05rem}
.kpis.three{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.diff{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;padding:16px 20px;margin-bottom:16px}
.dcol{border-radius:12px;padding:14px 16px}
.dcol.before{background:#F1F5F9;border:1px solid var(--line2)}
.dcol.after{background:var(--blue-soft);border:1px solid var(--blue-line)}
.dcol .dl{font-size:.92rem;font-weight:700;color:var(--ink2);margin-bottom:4px}
.dcol b{display:block;font-size:1.05rem;line-height:1.5}
.dcol span{display:block;color:var(--ink2);font-size:.92rem;margin-top:6px}
.darrow{display:grid;place-items:center;color:var(--blue)}
.diff .btn{grid-column:1 / -1;justify-self:start}
.blankhead{padding:12px 24px;background:#FFF7D6;color:#7A4B00;font-weight:700;border-bottom:1px solid #F3E2A0}
.val.blank{color:var(--muted);border:2px dashed var(--line2);border-radius:10px;padding:14px;min-height:60px;background:#fff;animation:blink 1.1s step-end infinite}
@keyframes blink{50%{color:transparent}}
.doc.fillin .sec{animation:fill 1s ease-out}
@keyframes fill{from{background:#FFF7D6}to{background:#fff}}
.donecard .t2{color:var(--ink2);font-size:.95rem;margin:-12px 0 20px}
@media (max-width:820px){.diff{grid-template-columns:1fr}.darrow{transform:rotate(90deg)}.flow{flex-direction:column}.farrow{transform:rotate(90deg)}}
.tag{display:inline-block;background:#EEF2F6;color:#1F2937;border:1px solid #CBD5E1;border-radius:999px;padding:3px 11px;font-size:.9rem;font-weight:500}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#0F172A;color:#fff;padding:12px 20px;border-radius:12px;font-size:.98rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:6;max-width:90vw;text-align:center;box-shadow:var(--shadow)}
.toast.show{opacity:1}

@media (max-width:980px){
  .two{grid-template-columns:1fr}
  .srcpane{position:static}
}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:8px;padding:10px 12px;flex-wrap:wrap}
  .brand{padding:4px 6px}
  .brand small{display:none}
  .nav{flex-direction:row;flex:1;gap:4px}
  .nav button{padding:10px 10px;font-size:.92rem;min-height:44px}
  .nav button span.t{display:none}
  .side .sec,.side .me{display:none}
  .topbar{padding:0 16px;height:auto;min-height:56px;flex-wrap:wrap;gap:8px;padding-top:8px;padding-bottom:8px}
  .topbar .sample{margin-left:0}
  .content{padding:16px 14px 120px}
  .actions{left:0}
  .actions-in{padding:10px 14px}
  .actions-in .btn{flex:1}
  .tbl thead{display:none}
  .tbl tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}
  .tbl td{display:block;border:0;padding:6px 16px}
  .tbl td.act{text-align:left}
  .tbl td.act .btn{width:100%}
  .phead{flex-wrap:wrap}
  .phead .right{margin-left:0;align-items:flex-start;text-align:left}
}
@media print{.side,.topbar,.actions,.crumb,.editbar,.srcpane,.link{display:none}.shell{display:block}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="logo" id="logo"></div>
      <div><b>退院時サマリー</b><small>◯◯病院（画面の例）</small></div>
    </div>
    <div class="sec">使う人</div>
    <nav class="nav" aria-label="使う人を切り替える">
      <button data-role="flow"><span class="ic" data-i="arrow"></span><span class="t">流れと効果</span></button>
      <button data-role="doctor"><span class="ic" data-i="stethoscope"></span><span class="t">医師</span><span class="cnt" id="cnt-review"></span></button>
      <button data-role="clerk"><span class="ic" data-i="users"></span><span class="t">事務</span></button>
      <button data-role="admin"><span class="ic" data-i="chart"></span><span class="t">管理</span></button>
    </nav>

  function resultBox(p) {
    var wc = warnCount(p), names = p.f.filter(function (f) { return f.warn && !f.v; }).map(function (f) { return esc(f.k); }).join('、');
    return '<div class="result">' + ic('check') + '<div><b>下書きができました。</b>' + esc(p.doctor) + ' の確認待ちに入りました。' + (wc ? '<br>記録に見当たらない項目が ' + wc + ' つあります（' + names + '）。AIは作文せず、医師が確認します。' : '<br>記録に見当たらない項目はありません。') + '</div></div>';
  }
  function makeDraft(id, done, progHost) {
    var p = byId(id); p.status = 'making';
    if (progHost) { progHost.innerHTML = '<div class="progress"><i id="pg-' + id + '"></i></div><div class="note">作成中です（実際は約1分）…</div>'; setTimeout(function () { var i = document.getElementById('pg-' + id); if (i) i.style.width = '100%'; }, 30); }
    else toast('下書きを作成中です（実際は約1分）');
    setTimeout(function () { p.status = 'review'; p.draftBy = (role === 'clerk' ? '事務A' : '医師1'); p.draftAt = nowHM(); persist(p); updateCount(); done(); }, progHost ? 2300 : 1200);
  }

  // ---------- 管理：記録 ----------
  function renderAdmin() {
    stopTimer(); updateCount(); setTitle('使われ方の記録');
    var extra = P.filter(function (p) { return p.status === 'done' && p.doneAt && p.id !== 'A-1044'; }).map(function (p) { return { date: '今日', id: p.id, doctor: p.doctor, sec: p.sec, who: '医師' }; });
    var log = extra.concat([{ date: '今日', id: 'A-1044', doctor: '医師1', sec: 190, who: '医師' }], SAMPLE_LOG);
    var avg = Math.round(log.reduce(function (a, r) { return a + r.sec; }, 0) / log.length);
    var month = 23 + extra.length; var mx = Math.max.apply(null, WEEK.map(function (w) { return w.n; }));
    var h = '<div class="kpis">' +
      '<div class="card kpi"><div class="l">' + ic('users') + '今週使った人</div><div class="n">医師 9<small>/12人</small></div><div class="bar"><i style="width:75%"></i></div>' +
      '<div class="n" style="font-size:1.5rem;margin-top:12px">事務 4<small>/5人</small></div><div class="bar g"><i style="width:80%"></i></div><div class="m">目安：医師または事務の過半数が毎週使っていること</div></div>' +
      '<div class="card kpi"><div class="l">' + ic('clock') + '医師の確認にかかった時間（平均）</div><div class="n">' + fmt(avg).replace(/(\d+)分/, '$1<small>分</small>').replace(/(\d+)秒/, '$1<small>秒</small>') + '</div><div class="m">1件あたり。下書きを開いてから確定まで</div></div>' +
      '<div class="card kpi"><div class="l">' + ic('clock') + '1件の医師の時間（報告された例）</div><div class="n">10分<small>→</small>5分</div><div class="m">750床の病院の例（厚生労働省の事例表）。自分の病院の数字は左の平均で見る</div></div>' +
      '<div class="card kpi"><div class="l">' + ic('file') + '今月 確定した件数</div><div class="n">' + month + '<small>件</small></div><div class="m">退院時サマリー</div>' +
      '<div class="chart">' + WEEK.map(function (w, i) { return '<div class="c' + (i === 2 ? ' t' : '') + '"><i style="height:' + Math.round(w.n / mx * 84) + 'px"></i>' + w.d + '</div>'; }).join('') + '</div></div>' +
      '</div>' +
      '<div class="card" style="margin-bottom:16px"><div class="hd"><h2>確定の記録</h2><span class="sub">確定のたびに自動で残ります</span></div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>日付</th><th>患者ID</th><th>主治医</th><th>確認にかかった時間</th><th>下書きを作った人</th></tr></thead><tbody>' +
      log.map(function (r) { return '<tr><td class="meta">' + esc(r.date) + '</td><td class="meta">' + esc(r.id) + '</td><td class="meta">' + esc(r.doctor) + '</td><td><b>' + fmt(r.sec) + '</b></td><td class="meta">' + esc(r.who) + '</td></tr>'; }).join('') +
      '</tbody></table></div></div>' +
      '<div class="card pad"><p class="note">この記録は、2026年6月1日からの国の決まり（AIの下書きを病院として入れ、大半の医師と事務の人が日常的に使う病院は、事務の人1人を1.2人と数えてよい）の届け出と、年1回の評価に使います。</p><p class="note">数字はすべてサンプルです。</p>' +
      '<div class="editbar"><button class="btn secondary" id="exp1">' + ic('download') + '届け出用に書き出す（準備中）</button><button class="btn secondary" id="exp2">' + ic('download') + '年1回の評価用に書き出す（準備中）</button></div>' +
      '<div style="margin-top:14px"><button class="link quiet" id="reset">練習で押した分をもどす</button></div></div>';
    view.innerHTML = h;
    document.getElementById('exp1').addEventListener('click', function () { toast('書き出しは準備中です（画面の例）'); });
    document.getElementById('exp2').addEventListener('click', function () { toast('書き出しは準備中です（画面の例）'); });
    document.getElementById('reset').addEventListener('click', function () { try { localStorage.removeItem(KEY); } catch (e) {} location.hash = ''; location.reload(); });
  }

  // ---------- 発表用デモ（字幕＋「次へ」で6手順を進める） ----------
  var TOUR = [
    { t: '今までは、退院のたびに医師がカルテを読み返し、白紙に8項目を手で書いていました。これからは、カルテの記録がこの画面に入り、AIが下書きを作り、医師は読んで直して確定するだけです。', say: '流れを見たら「次へ」。事務の人の画面に移ります。',
      go: function () { setRole('clerk'); } },
    { t: '事務の人の画面。今日退院する4人が並んでいます。患者Dは、まだ下書きがありません。', say: '「次へ」で、患者Dの下書きを作る所を開きます。',
      go: function () { var p = byId('A-1052'); if (p.status === 'none') openMake('A-1052'); } },
    { t: 'カルテの記録を貼り付けてあります。「下書きを作る」を押すと、AIが国の決めた項目の形で下書きを作ります。実際は約1分です。', say: '「次へ」で押します。',
      go: function () { var b = document.getElementById('go-A-1052'); if (b) b.click(); }, wait: 2800 },
    { t: '下書きができて、主治医の「確認待ち」に入りました。記録にないことは、AIは作文せず「要確認」で止めます。', say: '次は、医師の画面です。',
      go: function () { setRole('doctor'); renderReview('A-1023'); } },
    { t: 'まず、今までの画面です。8つの項目が白紙で、医師がカルテを読み返しながら全部手で入力していました。1件 10〜15分という例があります。', say: '「次へ」で、AIの下書きを入れます。',
      go: function () { var p = byId('A-1023'); setBlank(p, false, true); window.scrollTo({ top: 0, behavior: 'smooth' }); } },
    { t: 'AIの下書きが入りました。カルテの記録から8項目が埋まります（約1分）。右が元の記録で、項目に触れると色がつきます。医師は書きません。読んで、直す所だけ直します。', say: '「次へ」で、要確認の項目へ。',
      go: function () { var p = byId('A-1023'); setBlank(p, false, false); } },
    { t: '医師の画面。左がAIの下書き、右が元のカルテの記録です。全体で約5分以内に終わる、という報告があります。', say: '「次へ」で、要確認の項目へ。',
      go: function () { var el = document.getElementById('f5'); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('flash'); setTimeout(function () { el.classList.remove('flash'); }, 1600); } } },
    { t: 'アレルギーは記録に見当たらないので、AIは書いていません。医師が「なし」を押すか、入力します。', say: '「次へ」で「なし」を押します。',
      go: function () { var b = document.querySelector('[data-none="5"]'); if (b) b.click(); window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); } },
    { t: '読んで直したら、下の緑のボタン「確認しました」を押します。押した瞬間に、確認にかかった時間が自動で残ります。', say: '「次へ」で押します。',
      go: function () { var b = document.getElementById('confirm'); if (b) b.click(); } },
    { t: '確定しました。確認にかかった時間が記録されました。医師がしたのは、読んで、1か所押して、確定の3つだけです。', say: '最後に、管理の画面です。',
      go: function () { setRole('admin'); } },
    { t: '管理の画面。今週だれが使ったか、医師の確認は平均何分か、件数。これが、2026年6月からの国の決まりの届け出と、年1回の評価に出す数字になります。', say: 'ここまでが全体です。', go: null }
  ];
  var tourI = -1, tourBar = null;
  function tourShow() {
    if (!tourBar) { tourBar = document.createElement('div'); tourBar.className = 'tour'; document.body.appendChild(tourBar); document.body.classList.add('touring'); }
    var st = TOUR[tourI], last = tourI === TOUR.length - 1;
    tourBar.innerHTML = '<div class="tour-in"><span class="tour-n">' + (tourI + 1) + ' / ' + TOUR.length + '</span><div class="tour-t"><b>' + esc(st.t) + '</b><span>' + esc(st.say) + '</span></div>' +
      '<button class="btn primary" id="tour-next">' + (last ? '終わる' : '次へ') + ic('arrow') + '</button><button class="link quiet" id="tour-quit">デモをやめる</button></div>';
    document.getElementById('tour-next').addEventListener('click', tourNext);
    document.getElementById('tour-quit').addEventListener('click', tourEnd);
  }
  function tourNext() {
    var st = TOUR[tourI];
    if (tourI === TOUR.length - 1) return tourEnd();
    var btn = document.getElementById('tour-next'); if (btn) btn.disabled = true;
    if (st.go) st.go();
    setTimeout(function () { tourI++; tourShow(); }, st.wait || 400);
  }
  function tourEnd() { if (tourBar) { tourBar.remove(); tourBar = null; } document.body.classList.remove('touring'); tourI = -1; setRole('flow'); }
  function tourStart() { try { localStorage.removeItem(KEY); } catch (e) {} location.hash = 'demo=1'; location.reload(); }
  document.getElementById('demo').addEventListener('click', tourStart);

  // ---------- 最初の表示（#role=clerk / #open=A-1023 / #demo=1 で直接開ける） ----------
  var hash = {};
  location.hash.replace(/^#/, '').split('&').forEach(function (kv) { var a = kv.split('='); if (a[0]) hash[a[0]] = decodeURIComponent(a[1] || ''); });
  if (hash.demo) {
    history.replaceState(null, '', location.pathname);
    setGuide(true); setRole('flow'); tourI = 0; tourShow();
  } else {
    setRole(hash.role === 'clerk' || hash.role === 'admin' || hash.role === 'doctor' ? hash.role : 'flow');
    if (hash.open && byId(hash.open)) { setRole('doctor'); renderReview(hash.open); }
  }
})();
</script>
</body>
</html>
