<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>退院時サマリー（画面の例）</title>
<style>
:root{
  --bg:#F4F6F8; --card:#FFFFFF; --ink:#111827; --ink2:#374151; --muted:#6B7280; --line:#D9DEE3;
  --blue:#1A5FB4; --blue-dark:#154C90; --blue-soft:#E8F0FA;
  --green:#1B7F3B; --green-soft:#E6F4EA;
  --amber:#8A5300; --amber-soft:#FFF4E0; --amber-line:#E7B96B;
  --red:#B3261E; --red-soft:#FCEBEA;
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid #93C5FD;outline-offset:2px}

.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top-in{max-width:1040px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.app{font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:10px}
.app svg{width:28px;height:28px;color:var(--blue)}
.app .h{font-weight:500;color:var(--muted);font-size:.85rem;margin-left:4px}
.roles{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.roles button{border:0;background:#fff;padding:10px 18px;font-size:.95rem;color:var(--ink2);min-height:48px}
.roles button+button{border-left:1px solid var(--line)}
.roles button[aria-selected=true]{background:var(--blue);color:#fff;font-weight:700}
.sample{background:#EEF1F4;color:#4B5563;text-align:center;font-size:.85rem;padding:6px 12px}

main{max-width:1040px;margin:0 auto;padding:24px 20px 130px}
h1{font-size:1.4rem;margin:0 0 6px;line-height:1.4}
.sub{color:var(--ink2);margin:0 0 20px;font-size:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pname{font-size:1.3rem;font-weight:700;line-height:1.4}
.pname .pid{font-size:.95rem;font-weight:500;color:var(--muted);margin-left:8px}
.pmeta{color:var(--ink2);font-size:.95rem;margin-top:2px}
.spacer{flex:1}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;font-size:.9rem;white-space:nowrap;line-height:1.6}
.chip.review{background:var(--blue-soft);color:var(--blue)}
.chip.done{background:var(--green-soft);color:var(--green)}
.chip.none{background:#EEF1F4;color:#4B5563}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.chip.making{background:#EEF1F4;color:#4B5563}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 24px;min-height:52px;font-weight:700;font-size:1rem;border:2px solid transparent;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-dark)}
.btn.secondary{background:#fff;color:var(--blue);border-color:var(--blue)}
.btn.secondary:hover{background:var(--blue-soft)}
.btn.ghost{background:#fff;color:var(--ink2);border-color:var(--line)}
.btn.ghost:hover{background:#F3F4F6}
.btn.big{font-size:1.1rem;padding:16px 34px;min-height:62px}
.btn.ok{background:var(--green);color:#fff}
.btn.ok:hover{background:#166532}
.btn[disabled]{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--blue);text-decoration:underline;font-size:.95rem;padding:6px 4px;min-height:40px}
.link.small{font-size:.85rem;color:var(--muted)}

.back{margin-bottom:12px}
.phead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.alert{border:2px solid var(--amber-line);background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-weight:700}
.field{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:12px;scroll-margin-top:90px}
.field.warn{border:2px solid var(--amber-line);background:#FFFBF2}
.field.flash{box-shadow:0 0 0 4px #FCD34D}
.flabel{font-size:.95rem;color:var(--ink2);font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.fval{font-size:1.08rem;white-space:pre-wrap;line-height:1.75}
.fval.empty{color:var(--amber);font-weight:700}
.fsrc{margin-top:10px;display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.srcs{margin-top:10px}
.src{border-left:4px solid #BFD3EE;padding:8px 14px;background:#F8FAFC;border-radius:8px;font-size:.95rem;margin-top:8px}
.src .d{font-weight:700;color:var(--ink2);margin-right:10px}
.src .k{color:var(--muted);margin-right:10px}
textarea{width:100%;font:inherit;font-size:1.08rem;line-height:1.75;padding:12px 14px;border:2px solid var(--blue);border-radius:10px;min-height:130px;resize:vertical;color:var(--ink);background:#fff}
textarea.rec{border-color:var(--line);min-height:220px;font-size:1rem}
.editbar{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}

.actions{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.06);z-index:4}
.actions-in{max-width:1040px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.timer{color:var(--muted);font-size:.9rem;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block}

.done-card{text-align:center;padding:44px 24px 36px}
.done-card .ck{width:76px;height:76px;border-radius:50%;background:var(--green-soft);color:var(--green);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px}
.done-card .ck svg{width:40px;height:40px}
.done-card h1{font-size:1.5rem}
.done-card .t{font-size:1.05rem;color:var(--ink2);margin:6px 0 22px}
.done-card .t b{color:var(--ink);font-size:1.3rem}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.minor{margin-top:22px;display:flex;gap:6px 22px;justify-content:center;flex-wrap:wrap}

.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.kpi .card{margin:0}
.kpi .l{color:var(--ink2);font-size:.95rem;font-weight:700}
.kpi .n{font-size:2.3rem;font-weight:800;line-height:1.2;margin-top:4px;letter-spacing:-.01em}
.kpi .n small{font-size:1rem;font-weight:700;color:var(--ink2);margin-left:2px}
.kpi .m{color:var(--muted);font-size:.9rem;margin-top:4px}
.bar{height:12px;background:#EEF1F4;border-radius:6px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--blue)}
.bar.g i{background:var(--green)}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:1rem}
th{text-align:left;color:var(--ink2);font-weight:700;padding:10px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.note{color:var(--ink2);font-size:.95rem;margin:0 0 6px}
.progress{height:14px;background:#EEF1F4;border-radius:7px;overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;width:0;background:var(--blue);transition:width 2.2s linear}
.result{border:2px solid var(--green);background:var(--green-soft);border-radius:12px;padding:14px 18px;margin-top:14px}
.result b{color:var(--green)}
.steps{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px;padding:0;list-style:none}
.steps li{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:.95rem;color:var(--ink2)}
.steps li b{color:var(--blue);margin-right:6px}

.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 20px;border-radius:12px;font-size:1rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:6;max-width:90vw;text-align:center}
.toast.show{opacity:1}

@media (max-width:760px){
  html{font-size:17px}
  .kpi{grid-template-columns:1fr}
  .roles{margin-left:0;width:100%}
  .roles button{flex:1;padding:10px 6px}
  .row .btn{width:100%}
  .actions-in .btn{flex:1}
  .card,.field{padding:16px 16px}
}
@media print{.top,.sample,.actions,.back,.editbar,.link{display:none}}
</style>
</head>

  ];

  // ---------- 保存（練習で押した分。読めない環境でも落ちない） ----------
  var KEY = 'taiin-mock-v2';
  function load() { try { var s = localStorage.getItem(KEY); return s ? JSON.parse(s) : {}; } catch (e) { return {}; } }
  function save(o) { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} }
  var saved = load();
  P.forEach(function (p) {
    var s = saved[p.id];
    if (!s) return;
    if (s.status) p.status = s.status;
    if (s.sec != null) p.sec = s.sec;
    if (s.doneAt) p.doneAt = s.doneAt;
    if (s.draftBy) { p.draftBy = s.draftBy; p.draftAt = s.draftAt; }
    if (s.f) s.f.forEach(function (fv, i) { if (p.f[i]) { p.f[i].v = fv.v; p.f[i].warn = fv.warn; } });
  });
  function persist(p) {
    saved[p.id] = { status: p.status, sec: p.sec, doneAt: p.doneAt, draftBy: p.draftBy, draftAt: p.draftAt,
      f: p.f.map(function (x) { return { v: x.v, warn: !!x.warn }; }) };

  }

  // ---------- 共通 ----------
  var view = document.getElementById('view');
  var role = 'doctor';
  var timer = null, startAt = 0;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function byId(id) { for (var i = 0; i < P.length; i++) if (P[i].id === id) return P[i]; return null; }
  function fmt(sec) { var m = Math.floor(sec / 60), s = sec % 60; return (m ? m + '分' : '') + (s < 10 && m ? '0' + s : s) + '秒'; }
  function nowHM() { var d = new Date(); return d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2); }
  function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 2600); }
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
  function statusChip(p) {
    if (p.status === 'done') return '<span class="chip done">確定済み</span>';
    if (p.status === 'review') return '<span class="chip review">確認待ち</span>';

    return '<span class="chip none">下書きなし</span>';

  function warnCount(p) { return p.f.filter(function (f) { return f.warn && !f.v; }).length; }

  // ---------- 医師：今日の一覧 ----------

        (p.status === 'done' ? '<div class="pmeta">' + esc(p.doneAt) + ' に確定（確認にかかった時間 ' + fmt(p.sec) + '）</div>' : '') +

        '</div></div>';

  // ---------- 医師：確認の画面 ----------
  function renderReview(id) {
    var p = byId(id);
    if (!p) return renderDoctorHome();

    stopTimer();
    if (!readOnly) {
      startAt = Date.now();
      timer = setInterval(function () {

      }, 1000);
    }
    var h = '<div class="back"><button class="link" id="back">← 一覧にもどる</button></div>' +
      '<div class="phead"><div><div class="pname">' + esc(p.name) + '<span class="pid">' + esc(p.id) + '・' + esc(p.age) + '</span></div>' +
      '<div class="pmeta">' + esc(p.dept) + ' ' + esc(p.ward) + '　入院 ' + esc(p.admit) + ' 〜 退院 ' + esc(p.dis) + '　主治医 ' + esc(p.doctor) + '</div>' +
      (readOnly ? '<div class="pmeta">' + esc(p.doneAt) + ' に確定済み（確認にかかった時間 ' + fmt(p.sec) + '）</div>'
                : '<div class="pmeta">下書き：' + esc(p.draftBy) + ' が ' + esc(p.draftAt) + ' に作成。文はカルテの記録から作っています。各項目の「記録を見る」で元の記録が出ます。</div>') +
      '</div><div class="spacer"></div>' + statusChip(p) + '</div>' +

    var bar = document.createElement('div');
    bar.className = 'actions';

      (readOnly
        ? '<button class="btn ghost" id="print">印刷する</button><div class="spacer"></div><span class="timer">確定済みのため直せません</span>'
        : '<button class="btn ok big" id="confirm">確認しました（確定）</button><button class="btn ghost" id="later">あとで</button>' +
          '<div class="spacer"></div><span class="timer"><span class="dot"></span>確認を始めて <span id="tm">0秒</span>（自動で記録）</span>') +
      '</div>';

      document.getElementById('print').addEventListener('click', function () { window.print(); });

      document.getElementById('later').addEventListener('click', function () { renderDoctorHome(); });
      document.getElementById('confirm').addEventListener('click', function () { confirmDoc(p); });
    }
  }

  function renderFields(p, readOnly) {
    var box = document.getElementById('fields');
    var h = '';
    p.f.forEach(function (f, i) {
      var pending = f.warn && !f.v;
      h += '<section class="field' + (pending ? ' warn' : '') + '" id="f' + i + '">' +

        '</div><div class="srcs" id="src' + i + '" hidden>' +
        f.s.map(function (j) { return '<div class="src"><span class="d">' + esc(p.rec[j].d) + '</span><span class="k">' + esc(p.rec[j].k) + '</span>' + esc(p.rec[j].t) + '</div>'; }).join('') +

  function editField(p, i, readOnly) {

  function confirmDoc(p) {
    var idx = -1;

    if (idx >= 0) {

  var hash = {};

  setRole(hash.role === 'clerk' || hash.role === 'admin' ? hash.role : 'doctor');
  if (hash.open && role === 'doctor' && byId(hash.open)) renderReview(hash.open);
})();
